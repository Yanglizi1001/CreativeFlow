name: Publish Windows beta

on:
  push:
    branches: ['0.7.0-beta.2']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate version
        run: node -e "if(require('./package.json').version !== '0.7.0-beta.2') process.exit(1)"
      - name: Install locked dependencies
        run: npx --yes pnpm@10.15.1 install --frozen-lockfile --ignore-scripts
      - name: Download Electron runtime
        run: node node_modules/electron/install.js
      - name: Run color and migration tests
        run: npm run test:colors
      - name: Build application
        run: npm run build
      - name: Prepare desktop package
        run: node scripts/prepare-desktop.cjs
      - name: Build Windows x64 installer
        run: node node_modules/electron-builder/out/cli/cli.js --projectDir ./package-desktop --win nsis --x64 '-c.directories.output=../release/ci'
      - name: Build Windows x64 portable application
        run: node node_modules/electron-builder/out/cli/cli.js --projectDir ./package-desktop --prepackaged "$env:GITHUB_WORKSPACE/release/ci/win-unpacked" --win portable --x64 '-c.directories.output=../release/ci' '-c.win.artifactName=CreativeFlow-${version}-win-x64.${ext}'
      - name: Publish named beta release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (version !== '0.7.0-beta.2') throw new Error('Unexpected release version');
            const owner = context.repo.owner, repo = context.repo.repo;
            const files = [
              `CreativeFlow-Setup-${version}-win-x64.exe`,
              `CreativeFlow-${version}-win-x64.exe`
            ];
            const folder = path.join('release', 'ci');
            for (const file of files) {
              if (fs.statSync(path.join(folder, file)).size < 50_000_000) throw new Error(`Invalid package: ${file}`);
            }
            const sums = files.map(file => `${crypto.createHash('sha256').update(fs.readFileSync(path.join(folder, file))).digest('hex')}  ${file}`).join('\n') + '\n';
            fs.writeFileSync(path.join(folder, 'SHA256SUMS.txt'), sums);
            const body = fs.readFileSync(`docs/beta-${version}.md`, 'utf8');
            try {
              const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${version}`});
              if (ref.data.object.sha !== context.sha) throw new Error('Existing tag points to a different commit; refusing to replace it');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: `refs/tags/${version}`, sha: context.sha});
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag: version})).data;
              if (!release.prerelease) throw new Error('Refusing to replace a non-beta release');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: version, target_commitish: context.sha, name: version, body, draft: true, prerelease: true})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner, repo, release_id: release.id});
            for (const file of [...files, 'SHA256SUMS.txt']) {
              const existing = assets.find(asset => asset.name === file);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: existing.id});
              const data = fs.readFileSync(path.join(folder, file));
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: file, data, headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, name: version, body, prerelease: true, draft: false});
            core.summary.addHeading(version).addLink('Open private beta release', release.html_url);
            await core.summary.write();
